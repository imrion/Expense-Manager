{% load static%}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/animate.min.css' %}">
  </head>
  <body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg fixed-top bg-dark navbar-dark">
      <div class="container">
        <a class="navbar-brand fw-bold text-white" href="/">
          <img style="width:100px;" src="{% static 'img/django.png' %}">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto gap-2">
            {% if user.is_authenticated%}
              <li class="nav-item">
                <a class="nav-link text-white fw-medium" href="{% url 'expense_list' %}">EXPENSES</a>
              </li>
              <li class="nav-item">
                <a class="nav-link text-white fw-medium" href="{% url 'expense_create' %}">ADD EXPENSE</a>
              </li>
              <li class="nav-item">
                <a class="nav-link text-white btn btn-danger px-3 rounded-3 " href="{% url 'logout' %}">
                  LOGOUT
                </a>
              </li>
            {% else %}
              <li class="nav-item">
                <a class="nav-link  text-white fw-medium" href="{% url 'login' %}">
                  LOGIN
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link text-white btn btn-secondary px-3 rounded-3 shadow-sm" href="{% url 'register' %}">
                  REGISTER
                </a>
              </li>
            {% endif %}
          </ul>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <div class="container mt-5">
      <br/><br/><br/>
      {% block content %}
        
      {% endblock %}
    </div>

    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
    <script src="{% static 'js/main.js' %}"></script>
  </body>
</html>

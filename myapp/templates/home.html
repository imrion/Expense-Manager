{% extends "base.html" %}

{% block content %}

<div class="container mt-5">
    <div class="card border-0 rounded-4 p-4">
        <h4 class=" text-dark mb-4">Total Expenses by Category</h4>

        
            <div class="table-responsive">
                <table class="table table-hover align-middle rounded-3">
                    <thead class="bg-dark text-white">
                        <tr>
                            <th>Category</th>
                            <th class="text-end">Total Expense ($)</th>
                        </tr>
                    </thead>
                    <tbody>
                        
                            <tr class="border-bottom animated slideInUp ">
                                <td></td>
                                <td class="text-end">$</td>
                            </tr>
                        
                    </tbody>
                </table>
            </div>
            
            
                <p class="text-muted text-center">No expenses found.</p>
            

            <div class="d-flex justify-content-end mt-3">
                <a href="{% url 'expense_create' %}" class="btn btn-dark px-4 py-2 rounded-3  fw-medium">Add Expense</a>
            </div>
    </div>
</div>
{% endblock %}

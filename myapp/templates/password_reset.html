


<div class="container d-flex justify-content-center">

            <p class="text-muted text-center mb-3">Enter your email to receive a password reset link</p>

            
                
                    <div class="alert alert-danger text-center rounded-3"></div>

                <div>

                    Send Reset Link

            </form>
        </div>
    </div>
</div>

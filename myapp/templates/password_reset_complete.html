{% extends "base.html" %}
{% block content %}


<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="col-md-4 text-center">
        <div class="card auth-card animated zoomIn border-0 shadow rounded-4 p-4">
            <h3 class="fw-bold text-dark">Password Reset Successful</h3>
            <p class="text-muted">Your password has been successfully reset.</p>
            <a href="{% url 'login' %}?password_reset=success" class="btn btn-dark py-2 rounded-3 shadow-sm fw-medium">
                Back to Login
            </a>
        </div>
    </div>
</div>

{% endblock %}
